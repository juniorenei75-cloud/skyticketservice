{% extends "admin/base_admin.html" %}
{% block title %}{{ 'Editar' if pacote else 'Novo' }} pacote{% endblock %}

{% block content %}
<div class="admin-top">
  <h1>{{ 'Editar pacote' if pacote else 'Novo pacote' }}</h1>
  <a class="btn btn-ghost btn-sm" href="{{ url_for('admin_pacotes') }}">← Voltar</a>
</div>

<form method="post" class="form-card" style="max-width:720px">
  <div class="form-grid">
    <div class="form-group">
      <label for="titulo">Título *</label>
      <input id="titulo" name="titulo" required value="{{ pacote.titulo if pacote else '' }}">
    </div>
    <div class="form-group">
      <label for="destino">Destino *</label>
      <input id="destino" name="destino" required value="{{ pacote.destino if pacote else '' }}">
    </div>
    <div class="form-group full">
      <label for="descricao">Descrição *</label>
      <textarea id="descricao" name="descricao" required>{{ pacote.descricao if pacote else '' }}</textarea>
    </div>
    <div class="form-group full">
      <label for="inclui">O que inclui</label>
      <input id="inclui" name="inclui" value="{{ pacote.inclui if pacote else '' }}">
    </div>
    <div class="form-group">
      <label for="duracao_dias">Duração (dias)</label>
      <input id="duracao_dias" type="number" name="duracao_dias" min="1" value="{{ pacote.duracao_dias if pacote else 3 }}">
    </div>
    <div class="form-group">
      <label for="preco">Preço</label>
      <input id="preco" type="number" step="0.01" name="preco" value="{{ pacote.preco if pacote else '' }}">
    </div>
    <div class="form-group">
      <label for="moeda">Moeda</label>
      <select id="moeda" name="moeda">
        {% set m = pacote.moeda if pacote else 'MZN' %}
        <option value="MZN" {% if m == 'MZN' %}selected{% endif %}>MZN (Metical)</option>
        <option value="USD" {% if m == 'USD' %}selected{% endif %}>USD</option>
        <option value="EUR" {% if m == 'EUR' %}selected{% endif %}>EUR</option>
      </select>
    </div>
    <div class="form-group">
      <label for="imagem_url">URL da imagem</label>
      <input id="imagem_url" name="imagem_url" value="{{ pacote.imagem_url if pacote else '' }}">
    </div>
    <div class="form-group full">
      <label>
        <input type="checkbox" name="ativo" value="1" {% if not pacote or pacote.ativo %}checked{% endif %}>
        Activo no site
      </label>
    </div>
  </div>
  <button class="btn btn-primary" type="submit">Guardar</button>
</form>
{% endblock %}
